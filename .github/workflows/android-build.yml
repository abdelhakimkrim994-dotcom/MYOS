name: MYOS old-content temporary-signing experiment

on:
  push:
    branches:
      - experiment/old-content-permanent-signing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate temporary signing key and build release APK
        run: |
          STORE="$RUNNER_TEMP/myos-temporary.keystore"
          PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore "$STORE" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias myos-temporary \
            -keyalg RSA -keysize 3072 -validity 30 \
            -dname "CN=MYOS Temporary Test, OU=Experiment, O=MYOS, C=DZ"
          export MYOS_KEYSTORE_PATH="$STORE"
          export MYOS_KEYSTORE_PASSWORD="$PASSWORD"
          export MYOS_KEY_ALIAS="myos-temporary"
          gradle --no-daemon assembleRelease

      - name: Verify temporary APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"

      - name: Upload temporary-signed experiment APK
        uses: actions/upload-artifact@v4
        with:
          name: MYOS-Old-Content-Temporary-Signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
